name: Deploy to GitHub Pages

# 每次推送到 main 分支自动部署
on:
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:

# 赋予 Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # 站点根目录（index.html 所在位置）

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
